name: Unpack Hoop City Life Project

on:
  push:
    paths:
      - '.github/workflows/unpack-hoop.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/hoop
          gh release download hoop -p "*.zip" -D /tmp/hoop -R ${{ github.repository }}

      - name: Extract project into hoop-city-life directory
        run: |
          ZIP_FILE=$(ls /tmp/hoop/*.zip | head -n 1)
          echo "Extracting $ZIP_FILE..."
          mkdir -p hoop-city-life
          unzip -q "$ZIP_FILE" -d /tmp/raw_extracted

          # Se lo zip contiene una cartella radice singola (es. hoop-city-life o workspace)
          if [ $(ls -1 /tmp/raw_extracted | wc -l) -eq 1 ] && [ -d /tmp/raw_extracted/* ]; then
            SUBDIR=$(ls -d /tmp/raw_extracted/*)
            echo "Spreading from subdir: $SUBDIR"
            cp -r "$SUBDIR"/* hoop-city-life/ 2>/dev/null || true
            cp -r "$SUBDIR"/.* hoop-city-life/ 2>/dev/null || true
          else
            cp -r /tmp/raw_extracted/* hoop-city-life/ 2>/dev/null || true
            cp -r /tmp/raw_extracted/.* hoop-city-life/ 2>/dev/null || true
          fi

          # Pulizia: rimuovi cache importata pesante di Godot se supera limiti (.godot può essere rigenerata)
          # ma preserviamo tutti i file sorgente, scene (.tscn), script (.gd), assets (.png, .ogg, .wav), project.godot
          rm -rf hoop-city-life/.git
          
          # Se c'è una cartella .godot/imported molto grande, creiamo .gitignore appropriato per Godot
          cat << 'EOF' > hoop-city-life/.gitignore
          .godot/
          *.translation
          .import/
          export_presets.cfg
          EOF

          echo "Directory summary:"
          ls -la hoop-city-life | head -n 30
          du -sh hoop-city-life

      - name: Commit and push extracted project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add hoop-city-life/
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "feat(hoop-city-life): estrazione progetto Godot e asset ufficiali"
            git push origin arena/01a0cac8-new-arena-code
          fi
