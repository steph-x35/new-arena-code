name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'hoop-city-life/hoopcity/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Godot 4.3
        run: |
          mkdir -p /tmp/godot
          echo "Downloading Godot 4.3 Linux..."
          curl -sL https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip -o /tmp/godot/godot.zip
          unzip -q /tmp/godot/godot.zip -d /tmp/godot/bin
          chmod +x /tmp/godot/bin/Godot_*
          sudo ln -s /tmp/godot/bin/Godot_* /usr/local/bin/godot
          godot --version

      - name: Script Health Check (headless smoke)
        run: |
          cd hoop-city-life/hoopcity
          godot --headless --import > /tmp/import.log 2>&1 || true
          cat /tmp/import.log | grep -E "SCRIPT ERROR|Parse Error" && echo "!!! ERRORI DI PARSE NELL'IMPORT" || echo "Import pulito"
          ERR=0
          # HangCamProbe verifica la camera della schiacciata (zoom reale in
          # arena E campetto, ripristino al distacco): HANGCAM OK=true/false.
          # MenuProbe verifica il layout del menu principale.
          for SC in tools/HangCamProbe.tscn tools/MenuProbe.tscn tools/IntroProbe.tscn; do
            echo "=== SMOKE: $SC ==="
            timeout 180 godot --headless "res://$SC" --quit-after 900 > /tmp/smoke.log 2>&1 || true
            cat /tmp/smoke.log
            if grep -E "SCRIPT ERROR|Parse Error" /tmp/smoke.log > /tmp/smoke_err.txt; then
              echo "!!! SCRIPT ERRORS in $SC:"
              cat /tmp/smoke_err.txt
              ERR=1
            elif grep -q "HANGCAM OK=false" /tmp/smoke.log; then
              echo "!!! CAMERA DELLA SCHIACCIATA NON VERIFICATA in $SC"
              ERR=1
            elif grep -q "INTRO OK=false" /tmp/smoke.log; then
              echo "!!! FINESTRA NOVITA' NON VERIFICATA in $SC"
              ERR=1
            else
              echo "OK: $SC"
            fi
          done
          if [ "$ERR" != "0" ]; then
            echo "!!! SMOKE FALLITO: commito i log per la diagnosi"
            { cat /tmp/import.log; echo "--- PROBE ---"; cat /tmp/all_smoke.log; } > $GITHUB_WORKSPACE/hc_smoke_errors.log || true
            cd $GITHUB_WORKSPACE
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add hc_smoke_errors.log
            git commit -m "ci: log errori smoke Hoop City" || true
            git push origin arena/01a0cac8-new-arena-code || true
          fi
          exit $ERR

  build:
    needs: smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK PATH
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          echo "$ANDROID_HOME/build-tools/34.0.0" >> $GITHUB_PATH

      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME: $ANDROID_HOME"
          echo "JAVA_HOME: $JAVA_HOME"
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "build-tools;34.0.0" "platforms;android-34"

      - name: Download Godot 4.3 and Export Templates
        run: |
          mkdir -p /tmp/godot
          echo "Downloading Godot 4.3 Linux..."
          curl -sL https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip -o /tmp/godot/godot.zip
          unzip -q /tmp/godot/godot.zip -d /tmp/godot/bin
          chmod +x /tmp/godot/bin/Godot_*
          sudo ln -s /tmp/godot/bin/Godot_* /usr/local/bin/godot
          godot --version

          echo "Downloading Godot 4.3 Export Templates..."
          mkdir -p ~/.local/share/godot/export_templates/4.3.stable
          curl -sL https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz -o /tmp/godot/templates.tpz
          unzip -q /tmp/godot/templates.tpz -d /tmp/godot/tpl
          cp -r /tmp/godot/tpl/templates/* ~/.local/share/godot/export_templates/4.3.stable/
          ls -la ~/.local/share/godot/export_templates/4.3.stable/

      - name: Verify Export Presets
        run: |
          echo "=== export_presets.cfg ==="
          grep -E "permissions/vibrate|version/" hoop-city-life/hoopcity/export_presets.cfg
          cat hoop-city-life/hoopcity/export_presets.cfg | head -n 45

      - name: Configure Godot Editor Settings
        run: |
          mkdir -p ~/.config/godot
          cp hoop-city-life/.config/godot/editor_settings-4.3.tres ~/.config/godot/ 2>/dev/null || true
          sed -i "s|export/android/java_sdk_path = .*|export/android/java_sdk_path = \"$JAVA_HOME\"|g" ~/.config/godot/editor_settings-4.3.tres || true
          sed -i "s|export/android/android_sdk_path = .*|export/android/android_sdk_path = \"$ANDROID_HOME\"|g" ~/.config/godot/editor_settings-4.3.tres || true
          sed -i "s|export/android/debug_keystore = .*|export/android/debug_keystore = \"$GITHUB_WORKSPACE/hoop-city-life/hoopcity/keystore/debug.keystore\"|g" ~/.config/godot/editor_settings-4.3.tres || true
          cp ~/.config/godot/editor_settings-4.3.tres ~/.config/godot/editor_settings-4.tres || true
          echo "=== editor_settings-4.tres ==="
          grep "export/android" ~/.config/godot/editor_settings-4.tres

      - name: Script Health Check (headless scene smoke)
        run: |
          cd hoop-city-life/hoopcity
          godot --headless --import > /tmp/import.log 2>&1 || true
          ERR=0
          rm -f /tmp/smoke_all.log
          for SC in src/scenes/IntroScene.tscn src/scenes/MainMenu.tscn src/scenes/CityScene.tscn src/scenes/SoloCourt.tscn src/scenes/ArenaLobby.tscn src/scenes/TeamCourt.tscn src/scenes/GymScene.tscn src/scenes/DrillScene.tscn src/scenes/DuelScene.tscn; do
            echo "=== SMOKE: $SC ===" | tee -a /tmp/smoke_all.log
            timeout 90 godot --headless "res://$SC" --quit-after 150 > /tmp/smoke.log 2>&1 || true
            cat /tmp/smoke.log >> /tmp/smoke_all.log
            if grep -E "SCRIPT ERROR|Parse Error" /tmp/smoke.log > /tmp/smoke_err.txt; then
              echo "!!! SCRIPT ERRORS in $SC:" | tee -a /tmp/smoke_all.log
              cat /tmp/smoke_err.txt | tee -a /tmp/smoke_all.log
              ERR=1
            else
              echo "OK: $SC" | tee -a /tmp/smoke_all.log
            fi
          done
          if [ "$ERR" = "1" ]; then
            cp /tmp/smoke_all.log $GITHUB_WORKSPACE/smoke_errors.log
            cd $GITHUB_WORKSPACE
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add smoke_errors.log
            git commit -m "ci: smoke test errors log" || true
            git pull --rebase origin arena/01a0cac8-new-arena-code || true
            git push origin arena/01a0cac8-new-arena-code || true
          fi
          exit $ERR

      - name: Export Android APK
        run: |
          cd hoop-city-life/hoopcity
          mkdir -p build
          echo "Importing project assets in headless mode..."
          godot -v --headless --import 2>&1 | tee /tmp/import.log || true
          echo "Exporting Android APK..."
          godot -v --headless --export-release "Android" build/HoopCity-v2.47.0.apk 2>&1 | tee /tmp/export.log || true
          if [ ! -f "build/HoopCity-v2.47.0.apk" ]; then
            echo "=== EXPORT FAILED! Printing log: ==="
            cat /tmp/export.log | tail -n 80
            cp /tmp/export.log $GITHUB_WORKSPACE/build_error.log
            cd $GITHUB_WORKSPACE
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add build_error.log
            git commit -m "ci: debug export failure log" || true
            git push origin arena/01a0cac8-new-arena-code || true
            exit 1
          fi
          echo "Signing and aligning APK with project keystore via apksigner..."
          apksigner sign --ks $GITHUB_WORKSPACE/hoop-city-life/hoopcity/keystore/debug.keystore \
            --ks-pass pass:android \
            --ks-key-alias androiddebugkey \
            --key-pass pass:android \
            build/HoopCity-v2.47.0.apk
          echo "Verifying APK signature..."
          apksigner verify --verbose build/HoopCity-v2.47.0.apk
          echo "Checking APK launcher icons..."
          unzip -l build/HoopCity-v2.47.0.apk | grep -i "mipmap" | head -n 20
          ls -lh build/HoopCity-v2.47.0.apk
          echo "Verifica permessi APK (la stanza WiFi li richiede)..."
          aapt dump permissions build/HoopCity-v2.47.0.apk
          if ! aapt dump permissions build/HoopCity-v2.47.0.apk | grep -q "android.permission.INTERNET"; then
            echo "!!! MANCA android.permission.INTERNET: la stanza condivisa non può aprirsi"
            exit 1
          fi

      - name: Create or Update GitHub Release with APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp hoop-city-life/hoopcity/build/HoopCity-v2.47.0.apk /tmp/HoopCity-v2.47.0.apk
          gh release delete v2.47.0 -y --cleanup-tag || true
          # TAG ORFANO: se la create e' morta a meta' (tag creato, release no),
          # --cleanup-tag non lo rimuove perche' la release non esiste — e ogni
          # tentativo dopo fallisce con "tag already exists". Via il tag a mano.
          git push origin --delete v2.47.0 || true
          sleep 5
          # L'API delle release ogni tanto perde colpi (race delete/create):
          # tre tentativi prima di arrendersi.
          ok=0
          for i in 1 2 3; do
            if gh release create v2.47.0 /tmp/HoopCity-v2.47.0.apk \
              --title "Hoop City Life v2.47.0" \
              --notes "Aggiornamento v2.47.0 🏀 ONLINE: le palle sono DUE, una a testa — dopo ogni tiro la palla cade e RESTA a terra, e se la riprende chi ha le mani libere andandoci sopra (anche quella dell'altro!). Il 1v1 online ora e' IDENTICO a quello del Team Court: countdown, pulsante CHECK per dare il via, e in difesa SALTO (stoppata con scatto verso il tiratore), RUBATA e DIFENDI. CAMPETTO DA SOLO: dopo QUALSIASI tiro (canestro compreso) la palla finisce a terra e aspetta che sia tu ad andarla a prendere; il POST UP e' credibile: passo di spalle verso il ferro e posa da spalle al canestro con gambe piegate e braccia larghe."
              --target arena/01a0cac8-new-arena-code; then
              ok=1
              break
            fi
            echo "release create: tentativo $i fallito, riprovo..."
            sleep 10
          done
          if [ "$ok" != "1" ]; then
            # RACE API: la create puo' riuscire lato server e tornare comunque
            # errore; i tentativi dopo falliscono perche' la release esiste gia'.
            # Se la release c'e' (con l'APK), e' andata bene.
            if gh release view v2.47.0 > /dev/null 2>&1 \
            && gh release view v2.47.0 --json assets -q '.assets | length' | grep -q -v "^0$"; then
              echo "Release creata (il primo tentativo era riuscito lato server)."
            else
              echo "!!! IMPOSSIBILE CREARE LA RELEASE"
              exit 1
            fi
          fi
          echo "Release created successfully."
