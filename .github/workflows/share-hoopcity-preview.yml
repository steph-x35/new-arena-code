name: Share Hoop City preview APK
on:
  push:
    branches: [arena/5469f1e0-new-arena-code]
    paths: [.github/workflows/share-hoopcity-preview.yml]
permissions:
  actions: read
  contents: write
jobs:
  share:
    runs-on: ubuntu-latest
    steps:
      - name: Download previously tested preview
        uses: actions/download-artifact@v4
        with:
          name: HoopCity-anteprima-android
          run-id: 44179426443
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: preview-apk
      - name: Publish separately marked preview
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          test -f preview-apk/HoopCity-v2.49.7.apk
          cp preview-apk/HoopCity-v2.49.7.apk preview-apk/HoopCity-anteprima.apk
          gh release create anteprima-hcl-c846c96 preview-apk/HoopCity-anteprima.apk \
            --target c846c96ceb0efcd2a2606c37ce7c00d86419d6df \
            --title 'Hoop City Life - anteprima rimbalzi' \
            --notes 'APK di anteprima per i test. Non è una versione ufficiale.' \
            --prerelease --latest=false
