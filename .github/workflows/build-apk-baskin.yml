name: Baskin APK

# Pipeline APK di Baskin Academy. Il keystore NON sta mai nel repo arena:
# 1) se ci sono i Secrets (KEYSTORE_BASE64/KEYSTORE_PASSWORD/KEY_ALIAS/
#    KEY_PASSWORD) usa quelli;
# 2) altrimenti recupera il keystore ORIGINALE da progetto.zip su main
#    (e' gia' pubblico li' dentro: stessa firma dell'app installata, cosi'
#    l'APK si installa come aggiornamento);
# 3) se anche quello manca, genera un keystore debug nuovo (l'APK si
#    installa come app NUOVA).
# Per pubblicare: Actions -> Baskin APK -> Run workflow, oppure push di un
# tag baskin-v1.19.0 (crea la Release con l'APK allegato).

on:
  workflow_dispatch:
  push:
    tags:
      - 'baskin-v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepara il keystore (Secrets > progetto.zip > debug nuovo)
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -e
          mkdir -p baskin-academy/keystore
          KS="$GITHUB_WORKSPACE/baskin-academy/keystore/release.keystore"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$KS"
            echo "KS_ALIAS=${KEY_ALIAS}" >> "$GITHUB_ENV"
            echo "KS_PASS=${KEYSTORE_PASSWORD}" >> "$GITHUB_ENV"
            echo "KS_SOURCE=secret" >> "$GITHUB_ENV"
            echo "Keystore dai GitHub Secrets."
          elif git show origin/main:progetto.zip > /tmp/progetto.zip 2>/dev/null \
            && unzip -p /tmp/progetto.zip "progetto/baskin_academy/keystore/debug.keystore" > "$KS" 2>/dev/null \
            && [ -s "$KS" ]; then
            # Il vecchio keystore di debug del progetto (quello con cui e'
            # firmata l'app gia' distribuita): stessa firma = aggiornamento.
            echo "KS_ALIAS=androiddebugkey" >> "$GITHUB_ENV"
            echo "KS_PASS=android" >> "$GITHUB_ENV"
            echo "KS_SOURCE=progetto.zip" >> "$GITHUB_ENV"
            echo "::notice::Secret assenti: uso il keystore originale da progetto.zip (main)."
          else
            keytool -genkeypair -keystore "$KS" -alias baskindebug \
              -storepass android -keypass android -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=Baskin Academy Debug" >/dev/null 2>&1
            echo "KS_ALIAS=baskindebug" >> "$GITHUB_ENV"
            echo "KS_PASS=android" >> "$GITHUB_ENV"
            echo "KS_SOURCE=fresh-debug" >> "$GITHUB_ENV"
            echo "::warning::Nessun keystore trovato: generato uno nuovo. L'APK si installera' come app NUOVA (disinstalla la vecchia)."
          fi
          ls -la baskin-academy/keystore/

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Impronta del keystore (controllo firma)
        run: |
          keytool -list -v -keystore baskin-academy/keystore/release.keystore \
            -storepass "$KS_PASS" 2>/dev/null | grep -iE "SHA256|Alias" | head -4
          if [ "$KS_SOURCE" = "progetto.zip" ]; then
            FP=$(keytool -list -v -keystore baskin-academy/keystore/release.keystore \
              -storepass "$KS_PASS" 2>/dev/null | grep -i "SHA256:" | head -1 | tr -d ' ' | sed 's/SHA256://I')
            EXPECT="60:12:DD:C6:22:9E:66:DD:02:EB:AF:71:D4:24:C3:30:45:61:AE:1A:DE:BA:AA:DF:A4:B1:9D:DB:BD:52:94:F3"
            if [ "$(echo "$FP" | tr 'A-F' 'a-f')" = "$(echo "$EXPECT" | tr 'A-F' 'a-f')" ]; then
              echo "OK: impronta IDENTICA al keystore dell'APK gia' distribuito (si aggiorna)."
            else
              echo "::warning::Impronta DIVERSA da quella dell'APK originale ($FP)."
            fi
          fi

      - name: Setup Android SDK PATH
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          echo "$ANDROID_HOME/build-tools/34.0.0" >> $GITHUB_PATH
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "build-tools;34.0.0" "platforms;android-34"

      - name: Download Godot 4.3 e template di export
        run: |
          mkdir -p /tmp/godot
          curl -sL https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip -o /tmp/godot/godot.zip
          unzip -q /tmp/godot/godot.zip -d /tmp/godot/bin
          chmod +x /tmp/godot/bin/Godot_*
          sudo ln -s /tmp/godot/bin/Godot_* /usr/local/bin/godot
          godot --version
          mkdir -p ~/.local/share/godot/export_templates/4.3.stable
          curl -sL https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz -o /tmp/godot/templates.tpz
          unzip -q /tmp/godot/templates.tpz -d /tmp/godot/tpl
          cp -r /tmp/godot/tpl/templates/* ~/.local/share/godot/export_templates/4.3.stable/

      - name: Imposta i percorsi editor e il preset di firma
        run: |
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.3.tres <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "${JAVA_HOME}"
          export/android/android_sdk_path = "${ANDROID_HOME}"
          EOF
          cp ~/.config/godot/editor_settings-4.3.tres ~/.config/godot/editor_settings-4.tres
          # Il preset punta a res://keystore/debug.keystore (file git-ignorato):
          # lo giro sul keystore preparato sopra.
          cd baskin-academy
          sed -i "s|keystore/release=\".*\"|keystore/release=\"res://keystore/release.keystore\"|" export_presets.cfg
          sed -i "s|keystore/release_user=\".*\"|keystore/release_user=\"${KS_ALIAS}\"|" export_presets.cfg
          sed -i "s|keystore/release_password=\".*\"|keystore/release_password=\"${KS_PASS}\"|" export_presets.cfg
          grep keystore export_presets.cfg

      - name: Import headless ed export APK
        run: |
          cd baskin-academy
          godot --headless --import > /tmp/import.log 2>&1 || true
          V=$(grep 'version/name=' export_presets.cfg | head -1 | cut -d'"' -f2)
          echo "VERSIONE=$V" >> "$GITHUB_ENV"
          echo "Exporting v$V..."
          mkdir -p build
          godot --headless --export-release "Android" "build/BaskinAcademy-v${V}.apk" 2>&1 | tee /tmp/export.log || true
          if [ ! -f "build/BaskinAcademy-v${V}.apk" ]; then
            echo "=== EXPORT FALLITO: ultime righe di log ==="
            tail -n 60 /tmp/export.log
            exit 1
          fi
          ls -lh build/

      - name: Firma e verifica l'APK
        run: |
          cd baskin-academy/build
          APK=$(ls BaskinAcademy-v*.apk | head -1)
          # Firma esplicita (se Godot l'ha gia' firmata, questa la sostituisce)
          apksigner sign --ks ../keystore/release.keystore \
            --ks-pass "pass:$KS_PASS" --ks-key-alias "$KS_ALIAS" \
            --key-pass "pass:$KS_PASS" "$APK"
          apksigner verify --verbose "$APK" || exit 1
          unzip -l "$APK" | grep -i mipmap | head -n 6
          ls -lh "$APK"

      - name: Carica l'APK come artifact
        uses: actions/upload-artifact@v4
        with:
          name: BaskinAcademy-APK
          path: baskin-academy/build/BaskinAcademy-v*.apk
          retention-days: 30

      - name: Crea la Release (solo da tag baskin-v*)
        if: startsWith(github.ref, 'refs/tags/baskin-v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V="$VERSIONE"
          if [ "$KS_SOURCE" = "progetto.zip" ]; then
            NOTA="APK ARM64 firmato con il keystore ORIGINALE del progetto: si installa come aggiornamento sopra la versione precedente (stessa firma)."
          elif [ "$KS_SOURCE" = "secret" ]; then
            NOTA="APK ARM64 firmato con il keystore dai GitHub Secrets."
          else
            NOTA="APK ARM64 con keystore di debug NUOVO: si installa come app separata (se hai la vecchia versione, disinstallala prima)."
          fi
          gh release create "$GITHUB_REF_NAME" "baskin-academy/build/BaskinAcademy-v${V}.apk" \
            --title "Baskin Academy v${V}" \
            --notes "Baskin Academy v${V} — ${NOTA}" \
            --target arena/01a0cac8-new-arena-code || true
