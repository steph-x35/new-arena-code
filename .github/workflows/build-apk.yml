name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'hoop-city-life/hoopcity/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME: $ANDROID_HOME"
          echo "JAVA_HOME: $JAVA_HOME"
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "build-tools;34.0.0" "platforms;android-34"

      - name: Download Godot 4.3 and Export Templates
        run: |
          mkdir -p /tmp/godot
          echo "Downloading Godot 4.3 Linux..."
          curl -sL https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip -o /tmp/godot/godot.zip
          unzip -q /tmp/godot/godot.zip -d /tmp/godot/bin
          chmod +x /tmp/godot/bin/Godot_*
          sudo ln -s /tmp/godot/bin/Godot_* /usr/local/bin/godot
          godot --version

          echo "Downloading Godot 4.3 Export Templates..."
          mkdir -p ~/.local/share/godot/export_templates/4.3.stable
          curl -sL https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz -o /tmp/godot/templates.tpz
          unzip -q /tmp/godot/templates.tpz -d /tmp/godot/tpl
          cp -r /tmp/godot/tpl/templates/* ~/.local/share/godot/export_templates/4.3.stable/
          ls -la ~/.local/share/godot/export_templates/4.3.stable/

      - name: Extract original export presets if present
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/hoop
          gh release download hoop -p "*.zip" -D /tmp/hoop -R ${{ github.repository }} || true
          if ls /tmp/hoop/*.zip 1> /dev/null 2>&1; then
            ZIP_FILE=$(ls /tmp/hoop/*.zip | head -n 1)
            unzip -q "$ZIP_FILE" -d /tmp/raw_extracted || true
            find /tmp/raw_extracted -name "export_presets.cfg" -exec cp {} hoop-city-life/hoopcity/export_presets.cfg \; || true
          fi

      - name: Ensure export_presets.cfg exists
        run: |
          if [ ! -f "hoop-city-life/hoopcity/export_presets.cfg" ]; then
            echo "Generating export_presets.cfg..."
            cat << 'EOF' > hoop-city-life/hoopcity/export_presets.cfg
[preset.0]

name="Android"
platform="Android"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter=""
export_path="build/HoopCity-v2.25.0.apk"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false

[preset.0.options]

custom_template/debug=""
custom_template/release=""
gradle_build/use_gradle_build=false
architectures/arm64-v8a=true
architectures/armeabi-v7a=true
architectures/x86_64=false
architectures/x86=false
package/unique_name="com.example.hoopcity"
package/name="Hoop City Life"
package/signed=true
package/app_category=0
package/retain_data_on_uninstall=false
package/exclude_from_recents=false
package/show_in_launcher=true
version/code=112
version/name="2.25.0"
keystore/debug="res://keystore/debug.keystore"
keystore/debug_user="androiddebugkey"
keystore/debug_password="android"
keystore/release=""
keystore/release_user=""
keystore/release_password=""
screen/immersive_mode=true
screen/support_small=true
screen/support_normal=true
screen/support_large=true
screen/support_xlarge=true
user_data_backup/allow=false
command_line/extra_args=""
EOF
          else
            # Update version code and name
            sed -i 's/version\/code=.*/version\/code=112/' hoop-city-life/hoopcity/export_presets.cfg
            sed -i 's/version\/name=.*/version\/name="2.25.0"/' hoop-city-life/hoopcity/export_presets.cfg
            sed -i 's|export_path=.*|export_path="build/HoopCity-v2.25.0.apk"|' hoop-city-life/hoopcity/export_presets.cfg
          fi
          cat hoop-city-life/hoopcity/export_presets.cfg | head -n 35

      - name: Configure Godot Editor Settings
        run: |
          mkdir -p ~/.config/godot
          cp hoop-city-life/.config/godot/editor_settings-4.3.tres ~/.config/godot/ 2>/dev/null || true
          sed -i "s|export/android/android_sdk_path = .*|export/android/android_sdk_path = \"$ANDROID_HOME\"|g" ~/.config/godot/editor_settings-4.3.tres || true
          sed -i "s|export/android/debug_keystore = .*|export/android/debug_keystore = \"$GITHUB_WORKSPACE/hoop-city-life/hoopcity/keystore/debug.keystore\"|g" ~/.config/godot/editor_settings-4.3.tres || true

      - name: Export Android APK
        run: |
          cd hoop-city-life/hoopcity
          mkdir -p build
          echo "Importing project assets in headless mode..."
          godot --headless --import || true
          echo "Exporting Android APK..."
          godot --headless --export-release "Android" build/HoopCity-v2.25.0.apk
          ls -lh build/HoopCity-v2.25.0.apk

      - name: Create or Update GitHub Release with APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp hoop-city-life/hoopcity/build/HoopCity-v2.25.0.apk /tmp/HoopCity-v2.25.0.apk
          gh release delete v2.25.0 -y || true
          gh release create v2.25.0 /tmp/HoopCity-v2.25.0.apk \
            --title "Hoop City Life v2.25.0" \
            --notes "Aggiornamento v2.25.0 con Feature 1: Game Feel del Canestro (Aptica al rilascio perfetto/canestro/schiacciata/stoppata, menu impostazioni vibrazione e buzzer-beater clutch slow-mo)." \
            --target arena/01a0cac8-new-arena-code
          echo "Release created successfully."
