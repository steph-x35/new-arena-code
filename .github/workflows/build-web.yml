name: Build Web (iPhone/Safari)

on:
  workflow_dispatch:
  push:
    paths:
      - 'hoop-city-life/hoopcity/**'
      - '.github/workflows/build-web.yml'

permissions:
  contents: write

jobs:
  build-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Godot 4.3 + export templates
        run: |
          mkdir -p /tmp/godot ~/.local/share/godot/export_templates/4.3.stable
          curl -sL https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip -o /tmp/godot/godot.zip
          unzip -q /tmp/godot/godot.zip -d /tmp/godot/bin
          chmod +x /tmp/godot/bin/Godot_*
          sudo ln -s /tmp/godot/bin/Godot_* /usr/local/bin/godot
          godot --version
          curl -sL https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz -o /tmp/godot/templates.tpz
          unzip -q /tmp/godot/templates.tpz -d /tmp/godot/tpl
          ls /tmp/godot/tpl/templates/ | grep -i web | tee /tmp/tpl.log
          cp /tmp/godot/tpl/templates/web_*.zip ~/.local/share/godot/export_templates/4.3.stable/
          ls -la ~/.local/share/godot/export_templates/4.3.stable/ | tee -a /tmp/tpl.log

      - name: Import + Export Web (log sempre salvato)
        run: |
          cd hoop-city-life/hoopcity
          godot --headless --import > /tmp/import.log 2>&1 || true
          mkdir -p /tmp/webout
          godot --headless --export-release "Web" /tmp/webout/index.html > /tmp/export.log 2>&1 || true
          echo "EXIT=$?" | tee /tmp/exit.log
          { echo "=== TPL ==="; cat /tmp/tpl.log; echo "=== IMPORT ==="; tail -20 /tmp/import.log; echo "=== EXPORT ==="; cat /tmp/export.log; echo "=== OUT ==="; ls -la /tmp/webout; } > /tmp/full.log
          cat /tmp/full.log

      - name: Pubblica build + log sul branch
        if: always()
        run: |
          git config user.name "hoopcity-web-bot"
          git config user.email "actions@users.noreply.github.com"
          mkdir -p hoopcity/web
          cp -r /tmp/webout/. hoopcity/web/ 2>/dev/null || true
          cp /tmp/full.log hoopcity/web/build-log.txt 2>/dev/null || true
          git add -A hoopcity/web
          git commit -m "hoopcity: web build automatico [skip ci]" || true
          git push origin "HEAD:${GITHUB_REF_NAME}" || true
