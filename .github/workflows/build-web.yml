name: Build Web (iPhone/Safari)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Godot 4.3 + export templates
        run: |
          mkdir -p /tmp/godot ~/.local/share/godot/export_templates/4.3.stable
          echo "Downloading Godot 4.3 Linux..."
          curl -sL https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip -o /tmp/godot/godot.zip
          unzip -q /tmp/godot/godot.zip -d /tmp/godot/bin
          chmod +x /tmp/godot/bin/Godot_*
          sudo ln -s /tmp/godot/bin/Godot_* /usr/local/bin/godot
          godot --version
          echo "Downloading export templates (web)..."
          curl -sL https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz -o /tmp/godot/templates.tpz
          unzip -q /tmp/godot/templates.tpz -d /tmp/godot/tpl
          cp /tmp/godot/tpl/templates/web_debug.zip /tmp/godot/tpl/templates/web_release.zip ~/.local/share/godot/export_templates/4.3.stable/
          ls -la ~/.local/share/godot/export_templates/4.3.stable/

      - name: Import + Export Web
        run: |
          cd hoop-city-life/hoopcity
          godot --headless --import > /tmp/import.log 2>&1 || true
          tail -3 /tmp/import.log
          mkdir -p /tmp/webout
          godot --headless --export-release "Web" /tmp/webout/index.html
          echo "--- output ---"
          ls -la /tmp/webout
          du -sh /tmp/webout

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hoopcity-web
          path: /tmp/webout/
