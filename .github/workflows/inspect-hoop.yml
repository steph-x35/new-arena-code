name: Inspect and Setup Hoop City Life

on:
  push:
    paths:
      - '.github/workflows/inspect-hoop.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/hoop
          gh release download hoop -p "*.zip" -D /tmp/hoop -R ${{ github.repository }}
          ls -lh /tmp/hoop

      - name: Inspect ZIP contents
        run: |
          ZIP_FILE=$(ls /tmp/hoop/*.zip | head -n 1)
          echo "=== Top 50 largest files in ZIP ==="
          unzip -l "$ZIP_FILE" | sort -k1 -n -r | head -n 50

          echo "=== Root folders in ZIP ==="
          unzip -l "$ZIP_FILE" | awk '{print $4}' | cut -d/ -f1 | sort | uniq -c
