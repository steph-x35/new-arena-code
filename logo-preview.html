<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Logo LavoroFacile — Download & Anteprima</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #f1f5f9;
      color: #0f172a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .card {
      background: #fff;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(15,23,42,.1);
      text-align: center;
      max-width: 440px;
      width: 100%;
    }
    .logo-display {
      width: 260px;
      height: 260px;
      margin: 0 auto 20px;
      border-radius: 24px;
      overflow: hidden;
      border: 1px solid #e2e8f0;
      box-shadow: 0 4px 12px rgba(0,0,0,.05);
    }
    h1 { font-size: 1.4rem; margin: 0 0 6px; }
    p { font-size: .9rem; color: #64748b; margin: 0 0 20px; }
    .btn-group { display: flex; flex-direction: column; gap: 10px; }
    .btn {
      display: block;
      padding: 12px 20px;
      border-radius: 10px;
      font-weight: 700;
      text-decoration: none;
      font-size: .95rem;
      cursor: pointer;
      border: none;
      transition: all .15s ease;
    }
    .btn-primary { background: #2563eb; color: #fff; }
    .btn-primary:hover { background: #1d4ed8; }
    .btn-secondary { background: #f8fafc; color: #0f172a; border: 1px solid #cbd5e1; }
    .btn-secondary:hover { background: #f1f5f9; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo-display">
      <img src="logo.svg" alt="Logo LavoroFacile" style="width:100%; height:100%; display:block;" />
    </div>
    <h1>Logo Ufficiale LavoroFacile</h1>
    <p>Pronto per l'immagine profilo di TikTok, YouTube e per il sito web.</p>

    <div class="btn-group">
      <button class="btn btn-primary" onclick="downloadPNG(1080)">
        📥 Scarica PNG Alta Risoluzione (1080x1080)
      </button>
      <a href="logo.svg" download="logo-lavorofacile.svg" class="btn btn-secondary">
        📄 Scarica Vettoriale SVG
      </a>
      <a href="index.html" class="btn btn-secondary">
        ← Torna al sito
      </a>
    </div>
  </div>

  <canvas id="export-canvas" width="1080" height="1080" style="display:none;"></canvas>

  <script>
    function downloadPNG(size) {
      const canvas = document.getElementById('export-canvas');
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext('2d');
      const img = new Image();
      img.onload = function() {
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, size, size);
        ctx.drawImage(img, 0, 0, size, size);
        const a = document.createElement('a');
        a.download = 'logo-lavorofacile.png';
        a.href = canvas.toDataURL('image/png');
        a.click();
      };
      img.src = 'logo.svg';
    }
  </script>
</body>
</html>
