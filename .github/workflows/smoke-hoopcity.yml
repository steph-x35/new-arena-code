name: Hoop City Smoke Test

on:
  workflow_dispatch:
  push:
    paths:
      - 'hoop-city-life/hoopcity/**'
      - '.github/workflows/smoke-hoopcity.yml'

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Godot 4.3
        run: |
          mkdir -p /tmp/godot
          # -f: un errore HTTP NON diventa uno zip corrotto; il ciclo riprova
          # tre volte (i download da releases ogni tanto tremano sui runner).
          for i in 1 2 3; do
            curl -fSL --retry 3 --retry-delay 5 https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3_linux.x86_64.zip -o /tmp/godot/godot.zip && break
            echo "tentativo $i fallito, riprovo..."
            sleep 10
          done
          unzip -q /tmp/godot/godot.zip -d /tmp/godot/bin
          chmod +x /tmp/godot/bin/Godot_*
          sudo ln -s /tmp/godot/bin/Godot_* /usr/local/bin/godot
          godot --version

      - name: Script Health Check (headless smoke)
        run: |
          cd hoop-city-life/hoopcity
          godot --headless --import > /tmp/import.log 2>&1 || true
          cat /tmp/import.log | grep -E "SCRIPT ERROR|Parse Error" && echo "!!! ERRORI DI PARSE NELL'IMPORT" || echo "Import pulito"
          ERR=0
          rm -f /tmp/smoke_all.log
          # HangCamProbe verifica la camera della schiacciata (zoom reale in
          # arena E campetto, ripristino al distacco): HANGCAM OK=true/false.
          # MenuProbe verifica il layout del menu principale.
          for SC in tools/HangCamProbe.tscn tools/MenuProbe.tscn; do
            echo "=== SMOKE: $SC ===" | tee -a /tmp/smoke_all.log
            timeout 180 godot --headless "res://$SC" --quit-after 900 > /tmp/smoke.log 2>&1 || true
            cat /tmp/smoke.log >> /tmp/smoke_all.log
            if grep -E "SCRIPT ERROR|Parse Error" /tmp/smoke.log > /tmp/smoke_err.txt; then
              echo "!!! SCRIPT ERRORS in $SC:" | tee -a /tmp/smoke_all.log
              cat /tmp/smoke_err.txt | tee -a /tmp/smoke_all.log
              ERR=1
            elif grep -q "HANGCAM OK=false" /tmp/smoke.log; then
              echo "!!! CAMERA DELLA SCHIACCIATA NON VERIFICATA in $SC" | tee -a /tmp/smoke_all.log
              ERR=1
            else
              echo "OK: $SC" | tee -a /tmp/smoke_all.log
            fi
          done
          if [ "$ERR" = "1" ]; then
            cp /tmp/smoke_all.log $GITHUB_WORKSPACE/hoopcity_smoke_errors.log
            cd $GITHUB_WORKSPACE
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add hoopcity_smoke_errors.log
            git commit -m "ci: hoopcity smoke test errors log" || true
            git pull --rebase origin arena/01a0cac8-new-arena-code || true
            git push origin arena/01a0cac8-new-arena-code || true
          else
            if [ -f "$GITHUB_WORKSPACE/hoopcity_smoke_errors.log" ]; then
              cd $GITHUB_WORKSPACE
              git rm -q hoopcity_smoke_errors.log || true
              git config user.name "github-actions[bot]"
              git config user.email "github-actions[bot]@users.noreply.github.com"
              git commit -m "ci: hoopcity smoke pulito — rimuovo log errori" || true
              git pull --rebase origin arena/01a0cac8-new-arena-code || true
              git push origin arena/01a0cac8-new-arena-code || true
            fi
          fi
          exit $ERR
