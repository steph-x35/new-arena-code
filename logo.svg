<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@800;900&amp;display=swap');
      .logo-text {
        font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
        font-weight: 900;
        font-size: 56px;
        letter-spacing: -1.5px;
      }
    </style>
  </defs>

  <!-- Clean Background -->
  <rect width="500" height="500" fill="#ffffff" />

  <!-- Monogram Group -->
  <g transform="translate(175, 130)">
    <!-- Letter L in Deep Charcoal / Black -->
    <!-- Vertical stem: width 34px, height 146px; Base: width 106px, height 34px; smooth rounded corner -->
    <path d="M 0 0
             L 34 0
             L 34 112
             L 106 112
             C 113 112, 118 117, 118 124
             L 118 134
             C 118 141, 113 146, 106 146
             L 18 146
             C 8 146, 0 138, 0 128
             Z"
          fill="#1c1d21" />

    <!-- Letter F: Top Blue Pill -->
    <path d="M 50 0
             L 134 0
             C 144 0, 152 8, 152 18
             C 152 28, 144 36, 134 36
             L 50 36
             Z"
          fill="#3b82f6" />

    <!-- Letter F: Middle Blue Pill -->
    <path d="M 50 54
             L 118 54
             C 127 54, 134 61, 134 70
             C 134 79, 127 86, 118 86
             L 50 86
             Z"
          fill="#3b82f6" />
  </g>

  <!-- Brand Wordmark -->
  <text x="250" y="352" text-anchor="middle" class="logo-text">
    <tspan fill="#1c1d21">Lavoro</tspan><tspan fill="#3b82f6">Facile</tspan>
  </text>
</svg>
