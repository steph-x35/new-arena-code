name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'hoop-city-life/hoopcity/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK PATH
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          echo "$ANDROID_HOME/build-tools/34.0.0" >> $GITHUB_PATH

      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME: $ANDROID_HOME"
          echo "JAVA_HOME: $JAVA_HOME"
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "build-tools;34.0.0" "platforms;android-34"

      - name: Download Godot 4.3 and Export Templates
        run: |
          mkdir -p /tmp/godot
          echo "Downloading Godot 4.3 Linux..."
          curl -sL https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip -o /tmp/godot/godot.zip
          unzip -q /tmp/godot/godot.zip -d /tmp/godot/bin
          chmod +x /tmp/godot/bin/Godot_*
          sudo ln -s /tmp/godot/bin/Godot_* /usr/local/bin/godot
          godot --version

          echo "Downloading Godot 4.3 Export Templates..."
          mkdir -p ~/.local/share/godot/export_templates/4.3.stable
          curl -sL https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz -o /tmp/godot/templates.tpz
          unzip -q /tmp/godot/templates.tpz -d /tmp/godot/tpl
          cp -r /tmp/godot/tpl/templates/* ~/.local/share/godot/export_templates/4.3.stable/
          ls -la ~/.local/share/godot/export_templates/4.3.stable/

      - name: Verify Export Presets
        run: |
          echo "=== export_presets.cfg ==="
          grep -E "permissions/vibrate|version/" hoop-city-life/hoopcity/export_presets.cfg
          cat hoop-city-life/hoopcity/export_presets.cfg | head -n 45

      - name: Configure Godot Editor Settings
        run: |
          mkdir -p ~/.config/godot
          cp hoop-city-life/.config/godot/editor_settings-4.3.tres ~/.config/godot/ 2>/dev/null || true
          sed -i "s|export/android/java_sdk_path = .*|export/android/java_sdk_path = \"$JAVA_HOME\"|g" ~/.config/godot/editor_settings-4.3.tres || true
          sed -i "s|export/android/android_sdk_path = .*|export/android/android_sdk_path = \"$ANDROID_HOME\"|g" ~/.config/godot/editor_settings-4.3.tres || true
          sed -i "s|export/android/debug_keystore = .*|export/android/debug_keystore = \"$GITHUB_WORKSPACE/hoop-city-life/hoopcity/keystore/debug.keystore\"|g" ~/.config/godot/editor_settings-4.3.tres || true
          cp ~/.config/godot/editor_settings-4.3.tres ~/.config/godot/editor_settings-4.tres || true
          echo "=== editor_settings-4.tres ==="
          grep "export/android" ~/.config/godot/editor_settings-4.tres

      - name: Script Health Check (headless scene smoke)
        run: |
          cd hoop-city-life/hoopcity
          godot --headless --import > /tmp/import.log 2>&1 || true
          ERR=0
          rm -f /tmp/smoke_all.log
          for SC in src/scenes/IntroScene.tscn src/scenes/MainMenu.tscn src/scenes/CityScene.tscn src/scenes/SoloCourt.tscn src/scenes/ArenaLobby.tscn src/scenes/TeamCourt.tscn src/scenes/GymScene.tscn src/scenes/DrillScene.tscn; do
            echo "=== SMOKE: $SC ===" | tee -a /tmp/smoke_all.log
            timeout 90 godot --headless "res://$SC" --quit-after 150 > /tmp/smoke.log 2>&1 || true
            cat /tmp/smoke.log >> /tmp/smoke_all.log
            if grep -E "SCRIPT ERROR|Parse Error" /tmp/smoke.log > /tmp/smoke_err.txt; then
              echo "!!! SCRIPT ERRORS in $SC:" | tee -a /tmp/smoke_all.log
              cat /tmp/smoke_err.txt | tee -a /tmp/smoke_all.log
              ERR=1
            else
              echo "OK: $SC" | tee -a /tmp/smoke_all.log
            fi
          done
          if [ "$ERR" = "1" ]; then
            cp /tmp/smoke_all.log $GITHUB_WORKSPACE/smoke_errors.log
            cd $GITHUB_WORKSPACE
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add smoke_errors.log
            git commit -m "ci: smoke test errors log" || true
            git pull --rebase origin arena/01a0cac8-new-arena-code || true
            git push origin arena/01a0cac8-new-arena-code || true
          fi
          exit $ERR

      - name: Export Android APK
        run: |
          cd hoop-city-life/hoopcity
          mkdir -p build
          echo "Importing project assets in headless mode..."
          godot -v --headless --import 2>&1 | tee /tmp/import.log || true
          echo "Exporting Android APK..."
          godot -v --headless --export-release "Android" build/HoopCity-v2.36.0.apk 2>&1 | tee /tmp/export.log || true
          if [ ! -f "build/HoopCity-v2.36.0.apk" ]; then
            echo "=== EXPORT FAILED! Printing log: ==="
            cat /tmp/export.log | tail -n 80
            cp /tmp/export.log $GITHUB_WORKSPACE/build_error.log
            cd $GITHUB_WORKSPACE
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add build_error.log
            git commit -m "ci: debug export failure log" || true
            git push origin arena/01a0cac8-new-arena-code || true
            exit 1
          fi
          echo "Signing and aligning APK with project keystore via apksigner..."
          apksigner sign --ks $GITHUB_WORKSPACE/hoop-city-life/hoopcity/keystore/debug.keystore \
            --ks-pass pass:android \
            --ks-key-alias androiddebugkey \
            --key-pass pass:android \
            build/HoopCity-v2.36.0.apk
          echo "Verifying APK signature..."
          apksigner verify --verbose build/HoopCity-v2.36.0.apk
          echo "Checking APK launcher icons..."
          unzip -l build/HoopCity-v2.36.0.apk | grep -i "mipmap" | head -n 20
          ls -lh build/HoopCity-v2.36.0.apk

      - name: Create or Update GitHub Release with APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp hoop-city-life/hoopcity/build/HoopCity-v2.36.0.apk /tmp/HoopCity-v2.36.0.apk
          gh release delete v2.36.0 -y || true
          gh release create v2.36.0 /tmp/HoopCity-v2.36.0.apk \
            --title "Hoop City Life v2.36.0" \
            --notes "Aggiornamento v2.36.0 🏀 MANI SUL FERRO (davvero, a destra dove sta il canestro — non più al centro campo): le braccia arrivano naturali al bordo piegato e l'oscillazione resta. 🏆 Bottone sfida RIFATTO: quadratino 🏆 e bottone aperto sono DUE controlli che si scambiano la visibilità — più niente che sparisce o riappare strano. Un tap apre, due tap e parte." \
            --target arena/01a0cac8-new-arena-code
          echo "Release created successfully."
