name: Publish Hoop City official release
on:
  push:
    branches: [arena/65c3199c-new-arena-code]
    paths: [.github/workflows/publish-hoopcity-release.yml]
permissions:
  actions: read
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Retrieve tested APK
        uses: actions/download-artifact@v4
        with:
          name: HoopCity-anteprima-android
          run-id: 45049466481
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: release-apk
      - name: Publish official APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          test -s release-apk/HoopCity-v2.49.9.apk
          gh release create v2.49.9 release-apk/HoopCity-v2.49.9.apk \
            --target 295748552f3ebc900829a2834f7bdf2f7758b26c \
            --title 'Hoop City Life v2.49.9' \
            --notes 'Nuovi esercizi di tiro nell’allenamento di squadra, retina più reattiva e vibrazione più lunga sulle schiacciate.' \
            --latest
