name: Share Hoop City preview APK
on:
  push:
    branches: [arena/5469f1e0-new-arena-code]
    paths: [.github/workflows/share-hoopcity-preview.yml]
permissions:
  actions: read
  contents: write
jobs:
  share:
    runs-on: ubuntu-latest
    steps:
      - name: Download previously tested preview
        uses: actions/download-artifact@v4
        with:
          name: HoopCity-anteprima-android
          run-id: 44155623896
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: preview-apk
      - name: Publish separately marked preview
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          test -f preview-apk/HoopCity-v2.49.7.apk
          cp preview-apk/HoopCity-v2.49.7.apk preview-apk/HoopCity-anteprima.apk
          gh release create anteprima-hcl-a437e919 preview-apk/HoopCity-anteprima.apk \
            --target a437e9195dc27a71b1cb7fb9cbc4db7c743fd3a1 \
            --title 'Hoop City Life - anteprima di prova' \
            --notes 'APK di anteprima per i test. Non è una versione ufficiale.' \
            --prerelease --latest=false
